<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dziennik ocen</title>
</head>
<body>
    <table>
        <thead>
            <tr>
            <th>Lp.</th>
            <th>Przedmiot</th>
            <th>Ocena</th>
            <th>Akcja</th>
            </tr>
        </thead>
        <tbody id="cialo"></tbody>
    </table>
    <p>Srednia: <span id="srednia"></span></p>
    <button type="submit" id="submit" onclick="srednia()">Oblicz średnią</button><br><br>
    <form id="MyForm">
        <label for="przedmiot">Przedmiot: </label>
        <input type="text" id="przedmiot"><br><br>
        <label for="ocena">Ocena: </label>
        <input type="number" min="1" max="6" id="ocena"><br><br>
        <button type="submit" id="submit">Dodaj ocenę</button>
        
    </form>

    <script src="appendChild.js"></script>
</body>
</html>
